<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laboratorio de música</title>
    <style>
      html, body { margin: 0; background: #0b0908; color: #e9dcc2; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
      main { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 16px; letter-spacing: 0.06em; margin: 0 0 4px; }
      p { opacity: 0.7; margin: 0 0 16px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
      button { font: inherit; color: inherit; background: none; border: 1px solid rgba(233, 220, 194, 0.4); padding: 6px 12px; cursor: pointer; }
      button.on { background: rgba(255, 197, 138, 0.22); border-color: #ffc58a; }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin: 16px 0; padding: 10px 12px; border-left: 3px solid #ffc58a; background: rgba(255, 255, 255, 0.04); white-space: pre-line; min-height: 3em; }
      label { display: flex; gap: 10px; align-items: center; }
      input[type='range'] { flex: 1; }
    </style>
  </head>
  <body>
    <main>
      <h1>Laboratorio de música</h1>
      <p>Solo en desarrollo (/music-lab.html). El motor del juego, sin el juego: elegí un ánimo y, si tiene varias secciones, empezá por la que quieras.</p>
      <div class="row"><button id="start">Iniciar audio</button></div>
      <div class="row" id="moods"></div>
      <div class="row" id="sections"></div>
      <div class="row"><button data-end="victory">Cierre: victoria</button><button data-end="defeat">Cierre: derrota</button></div>
      <div id="status">Pulsá “Iniciar audio”.</div>
      <label>Volumen <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" /></label>
    </main>
    <script type="module" src="/src/lab/musicLab.ts"></script>
  </body>
</html>
